name: Property tests

# The property tests with many more runs than in ci.yml, a few minutes.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MIX_ENV: test
  STREAM_DATA_MAX_RUNS: "20000"

jobs:
  properties:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-property-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Run the properties
        run: |
          set -o pipefail
          mix test test/mail_auth/property_test.exs 2>&1 | tee property.log
      - name: Open an issue with the seed and the smallest failing input
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed="$(grep -oE 'seed: [0-9]+' property.log | head -1 | grep -oE '[0-9]+' || true)"
          {
            echo "The weekly property run failed (seed $seed)."
            echo
            echo "Run it again with \`STREAM_DATA_MAX_RUNS=$STREAM_DATA_MAX_RUNS mix test test/mail_auth/property_test.exs --seed $seed\`, and turn the failing input below into an ordinary test."
            echo
            echo '```'
            grep -E -A 30 '^ +[0-9]+\) property' property.log | head -200
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue.md
          gh issue create --title "Property test failure ($(date -u +%F))" --body-file issue.md
