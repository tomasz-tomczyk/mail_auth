name: Release

# Started by pushing a tag vX.Y.Z to main. Publishing waits for the owner's
# approval of the hex environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: The tag matches @version in mix.exs
        run: |
          version="$(sed -nE 's/^  @version "(.*)"$/\1/p' mix.exs)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has a dated section for this version
        run: grep -qE "^## ${{ steps.version.outputs.version }} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Its CI run passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')"
          if [ "$passed" = "0" ]; then
            echo "No passing ci.yml run for $GITHUB_SHA"
            exit 1
          fi

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, test]
    runs-on: ubuntu-24.04
    environment: hex
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-release-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Publish the package and its docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

  hexdocs:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: HexDocs answers
        run: |
          # Follow redirects (HexDocs moved packages to <name>.hexdocs.pm) and
          # check the page is this version's docs, not just any answer.
          version="${{ needs.check.outputs.version }}"
          url="https://hexdocs.pm/mail_auth/$version/readme.html"
          for _ in $(seq 1 30); do
            if curl -fsSL "$url" | grep -q "MailAuth v$version"; then exit 0; fi
            sleep 10
          done
          echo "$url did not answer. Send the docs alone with: mix hex.publish docs --yes"
          exit 1
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "HexDocs missing for ${{ needs.check.outputs.version }}" \
            --body "Send the docs with \`mix hex.publish docs --yes\` from a checkout of $GITHUB_REF_NAME."

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-release-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix hex.build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          sha256sum "mail_auth-$VERSION.tar" > "mail_auth-$VERSION.tar.sha256"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "mail_auth-$VERSION.tar" "mail_auth-$VERSION.tar.sha256"
